
services:
  postgres:
    image: postgres:17-alpine
    container_name: tokenized-compute-yield-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: tcy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcy_dev_password}
      POSTGRES_DB: tokenized_compute_yield

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcy -d tokenized_compute_yield"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
